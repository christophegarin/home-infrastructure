# Port d'écoute
listening-port=3478

# Authentification par secret partagé
fingerprint
use-auth-secret

# Plage de ports pour les flux relayés
min-port=49160
max-port=49200

# Sécurité
no-loopback-peers
no-multicast-peers

# Limites de ressources
total-quota=0
bps-capacity=0
stale-nonce

# Journaux
log-file=stdout
